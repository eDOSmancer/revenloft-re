# Locations of the tools and third-party inputs. None of them is part of this repository: you put your own
# copies there (see README.md, "Setting up the tools", and tools/README.md).
# Relative paths are relative to the repository root. An environment variable of the same name overrides an entry.
[paths]
# Watcom C/C++32 10.0a (BIN/WCC386.EXE, W32RUN.EXE, WASM.EXE, WLINK.EXE; H/; LIB386/DOS/CLIB3S.LIB)
WATCOM10A = tools/watcom/w10a
# Watcom C/C++32 9.5 with patch levels A and B applied to the compiler (BIN/WCC386.EXE, WLINK.EXE; H/; LIB386/DOS/CLIB3S.LIB)
WATCOM95 = tools/watcom/w95b
# the DOS C library patch files of 9.5 patch levels A and B (OMF libraries of replacement modules)
3CSDL.A = tools/watcom/w95b-patch/3CSDL.A
3CSDL.B = tools/watcom/w95b-patch/3CSDL.B
# the DOS/4GW Professional loader (tools/getloader.py extracts it from an executable bound with it)
LOADER = tools/dos4gw/4gwpro.bin
