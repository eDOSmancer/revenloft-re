# Locations of the tools and third-party inputs (none of them is part of this repository).
# An environment variable of the same name overrides an entry.
[paths]
# Watcom C/C++32 10.0a (BIN/WCC386.EXE, WASM.EXE, WLINK.EXE, H/, LIB386/DOS/CLIB3S.LIB)
WATCOM10A = ~/Dev/ravenloft-re/tools/watcom/w10a
# Watcom C/C++32 9.5 with patch levels A and B applied to the compiler (BIN/WCC386.EXE, WLINK.EXE, H/, LIB386/DOS/CLIB3S.LIB)
WATCOM95 = ~/Dev/ravenloft-re/tools/watcom/w95b
# the DOS C library patch files of 9.5 patch levels A and B (OMF libraries of replacement modules)
3CSDL.A = ~/Dev/re-tools/watcom-src/w95b-pt/PA/3CSDL.A
3CSDL.B = ~/Dev/re-tools/watcom-src/w95b-pt/PB/3CSDL.B
# the DOS/4GW Professional loader (tools/getloader.py extracts it from an executable bound with it)
LOADER = ~/Dev/ravenloft-src-scratch/ext/4gwpro.bin
